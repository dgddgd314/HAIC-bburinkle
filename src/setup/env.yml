# Do not run this by hand -- use setup/install_conda_env.sh (it also installs the
# activation hook that loads ROS 2).
name: haic_team   # placeholder: install_conda_env.sh always passes -n $HAIC_ENV

channels:
  - conda-forge

dependencies:
  - python=3.10          # ROS 2 Humble's rclpy is built for Python 3.10
  - pip

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - -r requirements.txt
      - -r ../custom/requirements.txt
